    (function () {
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('sitespider-theme') || 'dark'
        );
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
