[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sitespider"
version = "1.0.0"
description = "Professional SEO site crawler — link structure, on-page SEO, robots, sitemap, Lighthouse"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "SiteSpider Contributors" }]
keywords = ["seo", "crawler", "lighthouse", "sitemap", "robots"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "requests>=2.31.0",
  "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sitespider = "sitespider.cli:main"
sitespider-serve = "sitespider.server:main"
sitespider-check = "sitespider.check:main"

[project.urls]
Homepage = "https://github.com/sitespider/sitespider"
Documentation = "https://github.com/sitespider/sitespider#readme"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
sitespider = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
